name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  corpus:
    name: corpus manifest valid and its pin resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest fields
        run: python3 scripts/check-manifest.py

      # The pinned artifact must exist and hash to what we claim. This does NOT
      # compare against upstream's newest dump: a newer upstream release is the
      # normal state between refreshes and must not turn unrelated pull requests
      # red. That comparison lives in corpus-refresh.yml.
      - name: Pinned artifact downloads and matches its hash
        run: |
          set -euo pipefail
          URL=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["url"])')
          WANT=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["sha256"])')
          WANT_SIZE=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["sizeBytes"])')
          curl -sfL "$URL" -o corpus.zip
          GOT=$(sha256sum corpus.zip | cut -d' ' -f1)
          GOT_SIZE=$(stat -c %s corpus.zip)
          echo "expected $WANT ($WANT_SIZE bytes)"
          echo "actual   $GOT ($GOT_SIZE bytes)"
          test "$WANT" = "$GOT"
          test "$WANT_SIZE" = "$GOT_SIZE"

      - name: Corpus binary is not committed
        run: |
          set -euo pipefail
          if git ls-files | grep -qE '^corpus/.*\.(sqlite|zip)$'; then
            echo "::error::corpus binary is committed - see CLAUDE.md invariant 4"
            exit 1
          fi
          echo "no corpus binary tracked"

  rust:
    name: tests, including the ones that need a second volume
    # macOS, not ubuntu: the whole execution layer is clonefile,
    # renamex_np and SF_DATALESS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace

      # A same-volume move is a rename, so the streamed path, the `placed`
      # state and abort-on-failure are unreachable without a real second
      # device. Those tests are #[ignore]d for a local `cargo test`; if CI
      # does not run them, nothing does.
      - name: Cross-volume execution and undo
        run: |
          set -euo pipefail
          DEV=$(hdiutil attach -nomount ram://2726297 | awk '{print $1}')
          trap 'hdiutil detach "$DEV" -quiet || true' EXIT
          diskutil eraseVolume "HFS+" CRTEST "$DEV"
          # Under ~1.1 GiB every run is refused by the free-space reserve,
          # which is why the disk is 1.3 GiB and not the smallest that fits.
          COMIC_RENAMER_TEST_VOLUME=/Volumes/CRTEST \
            cargo test -p comic-renamer-core --test apply_exec -- --ignored
          # And the CLI on top of it: core proves the streamed execution, this
          # proves the user is told the run crosses volumes before consenting.
          COMIC_RENAMER_TEST_VOLUME=/Volumes/CRTEST \
            cargo test -p comic-renamer --test cli -- --ignored

  mappings:
    name: mapping caps (rows per PR, file size)
    # macOS: xtask links the core crate, which is macOS-only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Key collisions and per-field validation are ordinary `cargo test`
      # assertions (the rust job). Only the per-PR caps need a diff.
      - name: Caps
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo xtask check-mappings "origin/${{ github.base_ref }}"
          else
            cargo xtask check-mappings
          fi

  # Re-downloads the release the `corpus` job already checks, because that job
  # runs on ubuntu and this code is macOS-only; sharing an artifact between
  # jobs would cost more YAML than 33.7 MB costs time. The hash is verified,
  # so a tampered or truncated download fails here rather than in a test.
  rust-corpus:
    name: corpus tests against the real release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the pinned release
        run: |
          set -euo pipefail
          URL=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["url"])')
          WANT=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["sha256"])')
          curl -sfL "$URL" -o "$RUNNER_TEMP/corpus.zip"
          GOT=$(shasum -a 256 "$RUNNER_TEMP/corpus.zip" | cut -d' ' -f1)
          WANT_SIZE=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["sizeBytes"])')
          GOT_SIZE=$(stat -f %z "$RUNNER_TEMP/corpus.zip")
          test "$WANT" = "$GOT"
          test "$WANT_SIZE" = "$GOT_SIZE"
      - name: Corpus tests
        run: |
          COMIC_RENAMER_TEST_ZIP="$RUNNER_TEMP/corpus.zip" \
            cargo test -p comic-renamer-core --test corpus -- --ignored

  fixtures:
    name: held-out fixtures well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-fixtures.py

  licence:
    name: code licence is GPL-3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE is GPL-3.0
        run: |
          set -euo pipefail
          # Two lines, because the title alone does not pin the version and
          # this repo has already shipped one licence it had not checked.
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'Version 3, 29 June 2007' LICENSE
          grep -q '^license = "GPL-3.0-or-later"$' Cargo.toml
          # And the Homebrew formula this repo emits, which is the copy the
          # public sees. It said MIT for a day after the switch, because the
          # original check only read the first line of LICENSE.
          grep -q 'license "GPL-3.0-or-later"' .github/workflows/release.yml
          # Named files, not the whole directory: this step's own text contains
          # the string it looks for, so a recursive grep matched itself and the
          # check could never pass.
          ! grep -n 'MIT' Cargo.toml .github/workflows/release.yml
          echo "GPL-3.0 confirmed in LICENSE, Cargo.toml and the emitted formula"

# What the `mappings` job guarantees: the decisions table is under 4 MiB, and a
# pull request adds at most 2,500 rows. Key collisions and per-field
# validation are ordinary `cargo test` assertions in the `rust` job. There is
# no coverage or false-positive threshold: nothing is stored without approval
# (D50), so `cargo xtask measure` reports and exits 0.
#
# The row cap is per pull request (§6.11) and diffs against the PR's base, so
# it does not run on a push to main. That is deliberate: the cap bounds
# contributed data, which arrives as a PR (`gh pr create`, corpus-refresh),
# and CLAUDE.md sanctions the maintainer pushing directly. A direct push can
# add any number of rows unchecked. The file-size cap does run on every push.
