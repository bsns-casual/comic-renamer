# Layer B — filename overrides (§6.2.1).
#
# The floor under the unmatched tail: initialisms no corpus resolves and no
# algorithm guesses. Every title here is verified against
# fixtures/humble-ground-truth.tsv, which records what Humble itself published
# next to each download.
#
# Fields are metadata only. Never a path, never a separator (invariant 1,
# §6.11) — the preset is the sole path constructor. `bundle` is required and
# matches when squash(bundle) is a substring of squash(source folder name); a
# bare filename key is not enough, because `vol1.pdf` recurs across publishers.
#
# Licence: CC BY-SA 4.0. See data/LICENSE.

