name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  corpus:
    name: corpus manifest valid and its pin resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest fields
        run: python3 scripts/check-manifest.py

      # The pinned artifact must exist and hash to what we claim. This does NOT
      # compare against upstream's newest dump: a newer upstream release is the
      # normal state between refreshes and must not turn unrelated pull requests
      # red. That comparison lives in corpus-refresh.yml.
      - name: Pinned artifact downloads and matches its hash
        run: |
          set -euo pipefail
          URL=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["url"])')
          WANT=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["sha256"])')
          WANT_SIZE=$(python3 -c 'import json;print(json.load(open("corpus/manifest.json"))["sizeBytes"])')
          curl -sfL "$URL" -o corpus.zip
          GOT=$(sha256sum corpus.zip | cut -d' ' -f1)
          GOT_SIZE=$(stat -c %s corpus.zip)
          echo "expected $WANT ($WANT_SIZE bytes)"
          echo "actual   $GOT ($GOT_SIZE bytes)"
          test "$WANT" = "$GOT"
          test "$WANT_SIZE" = "$GOT_SIZE"

      - name: Corpus binary is not committed
        run: |
          set -euo pipefail
          if git ls-files | grep -qE '^corpus/.*\.(sqlite|zip)$'; then
            echo "::error::corpus binary is committed - see CLAUDE.md invariant 4"
            exit 1
          fi
          echo "no corpus binary tracked"

  rust:
    name: tests, including the ones that need a second volume
    # macOS, not ubuntu: the whole execution layer is clonefile,
    # renamex_np and SF_DATALESS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace

      # A same-volume move is a rename, so the streamed path, the `placed`
      # state and abort-on-failure are unreachable without a real second
      # device. Those tests are #[ignore]d for a local `cargo test`; if CI
      # does not run them, nothing does.
      - name: Cross-volume execution and undo
        run: |
          set -euo pipefail
          DEV=$(hdiutil attach -nomount ram://2726297 | awk '{print $1}')
          trap 'hdiutil detach "$DEV" -quiet || true' EXIT
          diskutil eraseVolume "HFS+" CRTEST "$DEV"
          # Under ~1.1 GiB every run is refused by the free-space reserve,
          # which is why the disk is 1.3 GiB and not the smallest that fits.
          COMIC_RENAMER_TEST_VOLUME=/Volumes/CRTEST \
            cargo test -p comic-renamer-core --test apply_exec -- --ignored
          # And the CLI on top of it: core proves the streamed execution, this
          # proves the user is told the run crosses volumes before consenting.
          COMIC_RENAMER_TEST_VOLUME=/Volumes/CRTEST \
            cargo test -p comic-renamer --test cli -- --ignored

  mappings:
    name: mapping caps (rows per PR, file size)
    # macOS: xtask links the core crate, which is macOS-only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Key collisions and per-field validation are ordinary `cargo test`
      # assertions (the rust job). Only the per-PR caps need a diff.
      - name: Caps
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo xtask check-mappings "origin/${{ github.base_ref }}"
          else
            cargo xtask check-mappings
          fi

  fixtures:
    name: held-out fixtures well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-fixtures.py

  licence:
    name: code licence is MIT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE is MIT
        run: |
          set -euo pipefail
          head -1 LICENSE | grep -q 'MIT License'
          echo "MIT confirmed"

# Still missing: the held-out coverage measurement (Task 14), which needs
# xtask's grader. The silent-false-positive rate remains unmeasured by this
# workflow and must not be claimed by it or anything else.
#
# Also not run here: the four corpus tests behind COMIC_RENAMER_TEST_ZIP.
# They need the 33.7 MB release, which the corpus job above already
# downloads on ubuntu while the code is macOS-only. Worth wiring when the
# gate job lands and the download is being paid for anyway.
